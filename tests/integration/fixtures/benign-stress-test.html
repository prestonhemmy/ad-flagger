<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Fixture — Benign Stress Test (20 elements)</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #1e293b; padding: 0; }

    .site-header { background: #1a1a2e; color: white; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
    .site-header .logo { font-size: 18px; font-weight: 800; }
    .site-header .logo span { color: #4ade80; }
    .site-header nav a { color: #94a3b8; text-decoration: none; font-size: 12px; margin-left: 14px; }

    .container { max-width: 1200px; margin: 16px auto; padding: 0 16px; }
    .page-title { font-size: 18px; margin-bottom: 2px; }
    .page-sub { font-size: 12px; color: #64748b; margin-bottom: 14px; }

    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }

    .card { background: white; border-radius: 8px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); display: flex; flex-direction: column; }
    .card h3 { font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #1e293b; }
    .card p { font-size: 11px; color: #64748b; margin-bottom: 10px; line-height: 1.4; flex: 1; }
    .card a, .card button {
      display: block; padding: 8px 10px; border-radius: 5px;
      font-size: 12px; font-weight: 500; text-align: center;
      text-decoration: none; border: 1px solid #e2e8f0;
      background: #f1f5f9; color: #3b82f6; cursor: pointer;
      width: 100%; box-sizing: border-box;
    }
    .card a.primary, .card button.primary { background: #3b82f6; color: white; border-color: #3b82f6; font-weight: 600; }
    .card a.subtle, .card button.subtle { color: #475569; }
    .card a.danger-link { color: #dc2626; border-color: #fecaca; }

    .site-footer { text-align: center; padding: 16px; font-size: 11px; color: #94a3b8; margin-top: 16px; }
  </style>
</head>
<body>

<div class="site-header">
  <span class="logo">APK<span>Mirror</span></span>
  <nav>
    <a href="/apps">Apps</a>
    <a href="/games">Games</a>
    <a href="/uploads">Uploads</a>
    <a href="/faq">FAQ</a>
    <a href="/about">About</a>
  </nav>
</div>

<div class="container">
  <h1 class="page-title">Download SuperApp v5.0</h1>
  <p class="page-sub">Version 5.0 · 24.1 MB · Updated Jan 15, 2025</p>
  <div class="grid" id="grid"></div>
</div>

<div class="site-footer">&copy; 2025 APKMirror. All rights reserved.</div>

<script>
  const templates = [
    { title: 'SuperApp v5.0',         desc: 'Official signed APK, 24.1 MB.',                     tag: 'a',      href: '/files/superapp-5.0.apk',  text: 'Download APK',           cls: 'primary' },
    { title: 'Browse Versions',       desc: 'View changelog and older releases.',                tag: 'a',      href: '/superapp/versions',       text: 'Version Archive',        cls: '' },
    { title: 'Need Help?',            desc: 'Common install questions and fixes.',               tag: 'a',      href: '/faq',                     text: 'View FAQ',               cls: '' },
    { title: 'SuperApp Pro',          desc: 'No ads, faster sync. 7-day free trial.',            tag: 'a',      href: '/superapp/pro',            text: 'Upgrade to Pro',         cls: 'primary' },
    { title: 'Google Play',           desc: 'Official listing with auto-updates.',               tag: 'a',      href: 'https://play.google.com/store/apps/details?id=com.superapp', text: 'View on Play Store', cls: 'subtle' },
    { title: 'Stay Updated',          desc: 'Get notified of new releases.',                     tag: 'button', href: null,                       text: 'Subscribe',              cls: '' },
    { title: 'Share This App',        desc: "Know someone who'd find this useful?",              tag: 'button', href: null,                       text: 'Copy Link',              cls: 'subtle' },
    { title: 'Report an Issue',       desc: 'Found a broken link? Let us know.',                 tag: 'a',      href: '/support',                 text: 'Report Problem',         cls: 'danger-link' },
    { title: 'Alternative Mirror',    desc: 'Hosted on download.apkmirror.com.',                 tag: 'a',      href: 'https://download.apkmirror.com/files/superapp-5.0.apk', text: 'Download from Mirror', cls: '' },
    { title: 'Permissions',           desc: 'Camera, Storage, Internet.',                        tag: 'a',      href: '/superapp/permissions',    text: 'View Permissions',       cls: 'subtle' },
    { title: 'User Reviews',          desc: '★★★★★ "Works perfectly on my Pixel 8."',          tag: 'button', href: null,                       text: 'Helpful (42)',           cls: 'subtle' },
    { title: 'Related: MegaTools',    desc: '★★★★☆ 4.2 · Free utility app.',                    tag: 'a',      href: '/apps/megatools',          text: 'View App',               cls: '' },
    { title: 'Developer',             desc: 'SuperApp Inc. · 50M+ downloads.',                   tag: 'a',      href: '/developer/superapp-inc',  text: 'More by Developer',      cls: 'subtle' },
    { title: 'Save for Later',        desc: 'Bookmark to download on another device.',           tag: 'button', href: null,                       text: '★ Add to Favorites',     cls: 'subtle' },
    { title: "What's New in v5.0",    desc: 'Dark mode, perf fixes, redesigned settings.',       tag: 'a',      href: '/superapp/changelog',      text: 'Full Changelog',         cls: '' },
    { title: 'Screenshots',           desc: 'Preview the app interface.',                        tag: 'a',      href: '/superapp/screenshots',    text: 'View Screenshots',       cls: 'subtle' },
    { title: 'Compatibility',         desc: 'Android 8.0+, 50 MB free, ARM64.',                  tag: 'a',      href: '/superapp/compatibility',  text: 'Check Your Device',      cls: 'subtle' },
    { title: 'Contact Support',       desc: 'Have questions? Email the developer.',              tag: 'a',      href: 'mailto:support@superapp.example.com', text: 'Email Developer', cls: '' },
    { title: 'Privacy & Data',        desc: 'Usage analytics only. No 3rd-party sharing.',       tag: 'a',      href: '/superapp/privacy',        text: 'Privacy Policy',         cls: 'subtle' },
    { title: 'Rate This App',         desc: 'Help others by sharing your experience.',           tag: 'button', href: null,                       text: 'Write a Review',         cls: 'primary' },
  ];
  const grid = document.getElementById('grid');
  for (let i = 0; i < templates.length; i++) {
    const t = templates[i];
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h3>${t.title}</h3><p>${t.desc}</p>`;
    const el = document.createElement(t.tag);
    el.textContent = t.text;
    if (t.cls) el.className = t.cls;
    if (t.href) el.setAttribute('href', t.href);
    if (t.tag === 'button') el.setAttribute('onclick', 'void(0)');
    card.appendChild(el);
    grid.appendChild(card);
  }
</script>
</body>
</html>
